crons:
  - name: birthday-wishes
    description: "Sends AiSensy WhatsApp birthday wishes to customers whose birthday is today at 12:00 AM IST"
    cron: "0 0 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/birthday-wishes"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
